<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>Vérification des quiz</title>
<script src="../data/annales/questions-europeennes-2026.js"></script>
<script src="../data/categories/questions-europeennes.js"></script>
<script src="../questions-core.js"></script>
<pre id="checks">RUNNING</pre><iframe id="app" title="Quiz testé" style="width:1100px;height:850px"></iframe>
<script>
(async () => {
  const out = document.getElementById('checks'), frame = document.getElementById('app');
  const logs = [];
  const assert = (ok, label) => { if (!ok) throw new Error(label); };
  const pass = label => { logs.push('PASS ' + label); out.textContent = logs.join('\n'); };
  const base = { ...QcmAnnales, sources: { ...QcmAnnales.sources, ...QcmCategories.sources }, questions: [...QcmAnnales.questions, ...QcmCategories.questions], categories: QcmCategories.categories };
  const byId = new Map(base.questions.map(q => [q.id, q]));
  const prefix = 'sarahroyon-qcm-v1:';
  let doc, win;
  const originalSessions = new Map();
  const tick = () => new Promise(resolve => setTimeout(resolve, 20));
  const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
  async function ready() {
    for (let i = 0; i < 200; i++) {
      doc = frame.contentDocument; win = frame.contentWindow;
      if (doc?.getElementById('source-form') && !doc.getElementById('source-form').hidden) return;
      if (doc?.getElementById('load-error') && !doc.getElementById('load-error').hidden) throw new Error('Chargement du quiz');
      await tick();
    }
    throw new Error('Délai de chargement dépassé');
  }
  const el = id => doc.getElementById(id);
  function select(value) { const radio = [...doc.querySelectorAll('input[name=source]')].find(input => input.value === value); assert(radio, value); radio.click(); }
  function count(value, id = 'category-count') { el(id).value = value; el(id).dispatchEvent(new win.Event('input', { bubbles: true })); }
  const start = () => el('source-form').requestSubmit();
  const ids = () => [...doc.querySelectorAll('.question-card')].map(card => card.id);
  const back = () => el('change-source').click();
  const stored = source => JSON.parse(win.localStorage.getItem(prefix + source));
  async function reload() {
    await new Promise(resolve => { frame.addEventListener('load', resolve, { once: true }); win.location.reload(); });
    await ready();
  }
  function answer(id, letters) {
    for (const input of doc.getElementById(id).querySelectorAll('.choices input')) {
      input.checked = letters.includes(input.value);
    }
    doc.getElementById(id).querySelector('.choices input').dispatchEvent(new win.Event('change', { bubbles: true }));
  }
  try {
    assert(base.categories.length === 5 && base.categories.every(c => QcmCore.getCategoryQuestions(base, c.id).length === 75), '5 x 75');
    const selected = base.categories.flatMap(c => c.question_ids);
    assert(new Set(selected).size === 375 && selected.every(id => QcmCore.hasCorrection(byId.get(id)) && byId.get(id).correction.explication && byId.get(id).correction.sources.length), '375 corrigés complets distincts');
    assert(QcmCore.drawQuestions(base, 475).length === 475, '475 QCM conservés');
    const sample = { id: 'sample', type: 'qcm', choix: { a: 'A', b: 'B', c: 'C' }, correction: { reponses: ['a', 'b'] } };
    for (const [letters, status, points] of [[['a', 'b'], 'correct', 0.2], [['a'], 'partial', null], [['a', 'c'], 'incorrect', -0.1], [[], 'skipped', -0.05]]) {
      const result = QcmCore.evaluateQuestion(sample, letters);
      assert(result.status === status && result.points === points, 'Barème : ' + status);
    }
    assert(QcmCore.evaluateQuestion({ ...sample, correction: null }, ['a']).points === null, 'Question sans corrigé exclue');
    assert(QcmCore.evaluateQuestion({ ...sample, correction: { neutralisee: true } }, []).points === null, 'Question neutralisée exclue');
    const allQuestions = base.questions.filter(q => q.type === 'qcm');
    const perfect = QcmCore.summarize(allQuestions, Object.fromEntries(allQuestions.map(q => [q.id, q.correction.reponses])));
    assert(perfect.score === 95 && perfect.maximum === 95, 'Même barème sur toutes les origines');
    for (const source of Object.values(base.sources).filter(s => s.type === 'annale')) {
      for (const key of Object.keys(QcmCore.quizBareme)) {
        assert(QcmCore.quizBareme[key] === base.baremes[source.bareme][key], 'Barème conforme aux annales : ' + key);
      }
    }
    const partial = QcmCore.summarize([sample], { sample: ['a'] });
    assert(partial.score === 0 && partial.maximum === 0 && partial.graded === 0, 'Réponse partielle exclue du score et du maximum');
    const mixedQuestions = [0, 1, 2].map(i => ({ ...sample, id: 'mixed-' + i }));
    const mixed = QcmCore.summarize(mixedQuestions, { 'mixed-0': ['a', 'b'], 'mixed-1': ['c'] });
    assert(mixed.score === 0.05 && mixed.maximum === 0.6, 'Arrondi du score et du maximum');
    const blank = QcmCore.summarize(allQuestions, {});
    assert(blank.score === -23.75 && blank.maximum === 95, 'Pénalité des absences et score négatif');
    pass('Barème commun : réponses exactes, partielles, fausses, absentes et questions exclues');
    for (const c of base.categories) {
      assert(new Set(QcmCore.drawQuestions(base, 75, c.id).map(q => q.id)).size === 75, 'Tirage complet ' + c.id);
      for (const invalid of [0, -1, 1.5, 76, NaN, Infinity]) {
        let rejected = false;
        try { QcmCore.drawQuestions(base, invalid, c.id); } catch (e) { rejected = e instanceof RangeError; }
        assert(rejected, 'Bornes ' + c.id + ' : ' + invalid);
      }
    }
    const tiny = { questions: ['a', 'b', 'c', 'hors-theme'].map(id => ({ id, type: 'qcm' })), categories: [{ id: 'test', question_ids: ['a', 'b', 'c'] }] };
    const before = JSON.stringify(tiny), outcomes = new Set(), originalRandom = Math.random;
    try {
      for (const first of [.1, .5, .9]) for (const second of [.1, .9]) {
        const values = [first, second]; Math.random = () => values.shift();
        outcomes.add(QcmCore.drawQuestions(tiny, 2, 'test').map(q => q.id).join(''));
      }
    } finally { Math.random = originalRandom; }
    assert(outcomes.size === 6 && JSON.stringify(tiny) === before, 'Uniformité et absence de mutation');
    pass('Intégrité des 375 corrigés, tirages uniformes, limites et banque originale');
    frame.src = '../questions.html'; await ready();
    for (const key of [...QcmCore.getSourceIds(base), 'aleatoire', ...base.categories.map(c => 'categorie:' + c.id)]) {
      originalSessions.set(prefix + key, win.localStorage.getItem(prefix + key));
    }
    const officialIds = ['saeg-2026-externe-questions-europeennes', 'saeo-2026-externe-questions-europeennes', 'meae-sujet-v0-officiel-questions-europeennes'];
    assert(doc.querySelectorAll('input[name=source]').length === 9 && doc.querySelectorAll('#category-source-options input').length === 5, 'Trois annales, cinq catégories et un quiz aléatoire');
    assert(!el('training-sources'), 'Section des entraînements retirée');
    assert([...doc.querySelectorAll('.source-group h2')].map(h => h.textContent).join('|') === 'Annales|Catégories|Quiz aléatoire', 'Ordre des sections');
    assert(JSON.stringify([...doc.querySelectorAll('#official-source-options input')].map(input => input.value)) === JSON.stringify(officialIds), 'Ordre SAEG, SAEO, V0');
    assert(doc.querySelector('input[name=source]:checked').value === officialIds[0], 'SAEG sélectionné par défaut');
    const copyrightName = doc.querySelector('footer').textContent.split('©')[1].trim();
    assert(copyrightName && !doc.title.includes(copyrightName) && !doc.querySelector('main').textContent.includes(copyrightName), 'Nom réservé au copyright');
    for (const [index, sourceId] of officialIds.entries()) {
      select(sourceId);
      assert(el('category-settings').hidden && el('random-settings').hidden && el('category-count').disabled && el('random-count').disabled, 'Aucun tirage à configurer pour les annales');
      count('', 'category-count'); count('', 'random-count'); start();
      const expectedIds = QcmCore.getQuestions(base, sourceId).map(q => q.id);
      assert(expectedIds.length === (index === 2 ? 10 : 60) && JSON.stringify(ids()) === JSON.stringify(expectedIds), 'Questions et ordre de l’annale ' + sourceId);
      assert(el('quiz-title').textContent.startsWith(['SAEG', 'SAEO', 'V0'][index]) && el('regenerate').hidden && el('regenerate-help').hidden, 'Titre et commandes de l’annale');
      assert(!el('annale-link').hidden && el('annale-link').getAttribute('href') === base.sources[sourceId].url, 'Lien du sujet original');
      let officialNow = Date.now(); win.Date.now = () => officialNow;
      el('reset').click(); officialNow += 61000;
      for (const id of ids()) answer(id, byId.get(id).correction.reponses);
      el('quiz-form').requestSubmit();
      assert(el('results-title').textContent === (index === 2 ? '2 / 2 points' : '12 / 12 points') && el('timer').textContent === '01:01', 'Barème et chronomètre de l’annale');
      back();
      assert(el('source-form').querySelector('button[type=submit]').textContent.includes('Reprendre'), 'Reprise proposée pour l’annale');
      await reload(); select(sourceId); start();
      assert(!el('results').hidden && el('timer').textContent === '01:01' && doc.querySelectorAll('.choices input:checked').length >= expectedIds.length, 'Annale sauvegardée après rechargement');
      el('reset').click();
      assert(JSON.stringify(ids()) === JSON.stringify(expectedIds) && el('results').hidden && el('timer').textContent === '00:00' && !doc.querySelector('.choices input:checked'), 'Reset de l’annale');
      answer(ids()[0], byId.get(ids()[0]).correction.reponses); back();
      pass('Annale ' + ['SAEG', 'SAEO', 'V0'][index] + ' : questions dans l’ordre, correction, barème, chrono, reprise et reset');
    }
    const officialSessions = officialIds.map(sourceId => win.localStorage.getItem(prefix + sourceId));
    const legacyOfficialId = QcmCore.getQuestions(base, officialIds[0])[0].id;
    win.localStorage.setItem(prefix + officialIds[0], JSON.stringify({ answers: { [legacyOfficialId]: byId.get(legacyOfficialId).correction.reponses }, reviewed: false }));
    await reload(); select(officialIds[0]); start();
    assert(ids().length === 60 && el('timer').textContent === '00:00' && doc.querySelector('.choices input:checked'), 'Ancienne sauvegarde d’annale sans tirage ni chronomètre');
    back();
    win.localStorage.setItem(prefix + officialIds[0], officialSessions[0]);
    await reload();
    for (const c of base.categories) {
      select('categorie:' + c.id);
      for (const invalid of ['', '0', '76', '1.5']) { count(invalid); assert(!el('category-count').checkValidity(), 'Champ invalide ' + invalid); }
      count(75); start();
      assert(ids().length === 75 && ids().every(id => c.question_ids.includes(id)), 'Appartenance ' + c.id);
      assert(el('quiz-title').textContent === c.titre && !el('regenerate').hidden, 'Titre ' + c.id);
      assert(el('annale-link').hidden && !el('regenerate-help').hidden, 'Commandes du tirage par catégorie');
      assert(doc.querySelector('.question-number').textContent.endsWith('01'), 'Numérotation');
      for (const id of ids()) {
        const q = byId.get(id), single = base.sources[q.source.id].mode_reponse_qcm === 'une_seule';
        assert(doc.getElementById(id).querySelector('.choices input').type === (single ? 'radio' : 'checkbox'), 'Mode de réponse ' + id);
        answer(id, q.correction.reponses);
      }
      el('quiz-form').requestSubmit();
      assert(doc.querySelectorAll('.feedback.correct').length === 75 && doc.querySelectorAll('.feedback a').length >= 75, 'Affichage des 75 corrigés ' + c.id);
      assert(el('result-stats').querySelector('dd').textContent === '75', 'Bilan ' + c.id);
      assert(el('results-title').textContent === '15 / 15 points', 'Note chiffrée ' + c.id);
      const beforeReset = ids();
      el('reset').click();
      assert(JSON.stringify(ids()) === JSON.stringify(beforeReset) && el('results').hidden && !doc.querySelector('.choices input:checked'), 'Reset conserve les questions ' + c.id);
      assert(el('timer').textContent === '00:00' && el('progress').value === 0 && !doc.querySelector('.choices input:disabled'), 'Reset du temps et de la progression ' + c.id);
      el('regenerate').click();
      assert(ids().length === 75 && el('results').hidden && !doc.querySelector('.choices input:checked'), 'Régénération ' + c.id);
      back(); count(1); start(); assert(ids().length === 1, 'Une question ' + c.id); back();
      pass('Parcours complet ' + c.id + ' : 1 et 75 questions, corrections, bilan, régénération');
    }
    select('categorie:histoire'); count(7); start();
    const savedIds = ids(); answer(savedIds[0], byId.get(savedIds[0]).correction.reponses); back();
    select('categorie:institutions'); count(3); start(); back();
    select('categorie:histoire'); assert(el('category-count').value === '7', 'Nombre indépendant'); start();
    assert(JSON.stringify(ids()) === JSON.stringify(savedIds) && doc.querySelector('.choices input:checked'), 'Reprise indépendante');
    await reload();
    select('categorie:histoire'); assert(el('category-count').value === '7', 'Nombre après rechargement'); start();
    assert(JSON.stringify(ids()) === JSON.stringify(savedIds) && doc.querySelector('.choices input:checked'), 'Reprise après rechargement'); back();
    const preserved = win.localStorage.getItem(prefix + 'categorie:histoire');
    select('aleatoire'); count(9, 'random-count'); start(); assert(ids().length === 9, 'Quiz général'); el('regenerate').click(); back();
    assert(win.localStorage.getItem(prefix + 'categorie:histoire') === preserved, 'Isolation du quiz général');
    select('aleatoire'); count(475, 'random-count'); start();
    for (const id of ids()) answer(id, byId.get(id).correction.reponses);
    el('quiz-form').requestSubmit();
    assert(el('results-title').textContent === '95 / 95 points', 'Barème du quiz aléatoire complet');
    const randomIds = ids(); el('reset').click();
    assert(JSON.stringify(ids()) === JSON.stringify(randomIds) && !doc.querySelector('.choices input:checked') && el('timer').textContent === '00:00', 'Reset du quiz aléatoire');
    el('quiz-form').requestSubmit();
    assert(el('results-title').textContent === '-23,75 / 95 points', 'Quiz sans réponse');
    el('edit').click();
    const multiple = allQuestions.find(q => q.correction.reponses.length > 1);
    assert(multiple, 'Question à plusieurs bonnes réponses disponible');
    answer(multiple.id, [multiple.correction.reponses[0]]);
    el('quiz-form').requestSubmit();
    assert(el('results-title').textContent === '-23,7 / 94,8 points', 'Réponse partielle exclue du score affiché');
    assert(doc.getElementById(multiple.id).querySelector('.feedback').textContent.includes('Non notée') && el('result-stats').textContent.includes('Réponses partielles non notées'), 'Réponse partielle signalée séparément');
    el('edit').click();
    answer(multiple.id, [Object.keys(multiple.choix).find(letter => !multiple.correction.reponses.includes(letter))]);
    el('quiz-form').requestSubmit();
    assert(el('results-title').textContent === '-23,8 / 95 points', 'Pénalité de réponse incorrecte affichée');
    back();
    pass('Sauvegarde, reprise, isolation des thèmes, barème et reset des 475 questions aléatoires');
    assert(officialIds.every((sourceId, index) => win.localStorage.getItem(prefix + sourceId) === officialSessions[index]), 'Sauvegardes des annales indépendantes des catégories et du quiz aléatoire');

    select('categorie:histoire'); count(2); start(); el('reset').click();
    let now = Date.now();
    win.Date.now = () => now;
    // Restart with the controlled clock, then advance time without slowing down the checks.
    el('reset').click();
    now += 65000;
    await wait(1100);
    assert(el('timer').textContent === '01:05', 'Chronomètre actif');
    answer(ids()[0], byId.get(ids()[0]).correction.reponses);
    assert(stored('categorie:histoire').elapsedMs === 65000, 'Temps sauvegardé avec la réponse');
    await wait(4100);
    assert(stored('categorie:histoire').elapsedMs === 65000, 'Sauvegarde périodique');
    const timedIds = ids();
    back(); now += 120000; start();
    assert(el('timer').textContent === '01:05', 'Pause sur la sélection');
    now += 5000; el('quiz-form').requestSubmit();
    assert(el('timer').textContent === '01:10' && el('results-time').textContent.includes('01:10'), 'Arrêt au bilan');
    now += 60000; await wait(1100);
    assert(el('timer').textContent === '01:10', 'Temps figé au bilan');
    el('edit').click(); now += 3000;
    let hidden = true;
    Object.defineProperty(doc, 'hidden', { configurable: true, get: () => hidden });
    doc.dispatchEvent(new win.Event('visibilitychange'));
    assert(stored('categorie:histoire').elapsedMs === 73000, 'Pause lorsque l’onglet est masqué');
    now += 60000; hidden = false;
    doc.dispatchEvent(new win.Event('visibilitychange'));
    now += 2000; el('quiz-form').requestSubmit();
    assert(stored('categorie:histoire').elapsedMs === 75000, 'Reprise sans compter le temps masqué');
    await reload(); select('categorie:histoire'); start();
    assert(JSON.stringify(ids()) === JSON.stringify(timedIds) && !el('results').hidden && el('timer').textContent === '01:15', 'Bilan et temps conservés après rechargement');
    el('edit').click(); now = Date.now(); win.Date.now = () => now;
    el('reset').click(); now += 3605000; el('quiz-form').requestSubmit();
    assert(el('timer').textContent === '01:00:05', 'Durée supérieure à une heure');
    el('regenerate').click();
    assert(el('timer').textContent === '00:00' && stored('categorie:histoire').elapsedMs === 0 && !doc.querySelector('.choices input:checked'), 'Nouveau tirage remet le temps à zéro');
    now += 9000; answer(ids()[0], byId.get(ids()[0]).correction.reponses);
    win.dispatchEvent(new win.Event('pagehide'));
    assert(stored('categorie:histoire').elapsedMs === 9000, 'Temps enregistré au départ de la page');
    now += 60000; win.dispatchEvent(new win.Event('pageshow'));
    now += 1000; el('quiz-form').requestSubmit();
    assert(stored('categorie:histoire').elapsedMs === 10000, 'Reprise après retour navigateur');
    el('reset').click(); back(); await reload(); select('categorie:histoire'); start();
    assert(el('timer').textContent === '00:00' && !doc.querySelector('.choices input:checked') && el('results').hidden, 'Reset persistant');
    back();
    const legacyId = base.categories[0].question_ids[0];
    win.localStorage.setItem(prefix + 'categorie:histoire', JSON.stringify({ questionIds: [legacyId], answers: { [legacyId]: byId.get(legacyId).correction.reponses }, reviewed: true }));
    await reload(); select('categorie:histoire'); start();
    assert(el('timer').textContent === '00:00' && el('results-title').textContent === '0,2 / 0,2 points', 'Ancienne sauvegarde compatible');
    back();
    pass('Chronomètre, pauses, reprise, rechargement, reset persistant et anciennes sauvegardes');
    win.localStorage.setItem(prefix + 'categorie:histoire', JSON.stringify({ questionIds: [base.categories[1].question_ids[0]], answers: {} }));
    await reload(); select('categorie:histoire');
    assert(el('category-count').value === '20', 'Rejet du tirage sauvegardé hors catégorie');
    count(2); start(); assert(ids().every(id => base.categories[0].question_ids.includes(id)), 'Nouveau tirage valide'); back();
    frame.style.width = '375px'; await tick();
    assert(doc.documentElement.scrollWidth <= win.innerWidth, 'Pas de débordement sur mobile (sélection)');
    select('categorie:politiques'); count(5); start(); await tick();
    assert(doc.documentElement.scrollWidth <= win.innerWidth, 'Pas de débordement sur mobile (quiz)');
    back(); select(officialIds[0]); start(); await tick();
    assert(doc.documentElement.scrollWidth <= win.innerWidth && !el('reset').hidden && el('regenerate').hidden, 'Annale et reset sur mobile');
    pass('Sauvegarde invalide écartée et affichage mobile à 375 px');
    out.textContent = logs.join('\n') + '\nALL CHECKS PASSED';
  } catch (error) { out.textContent = logs.join('\n') + '\nFAIL ' + error.stack; }
  finally {
    if (doc?.getElementById('quiz') && !el('quiz').hidden) back();
    for (const [key, value] of originalSessions) {
      if (value === null) win.localStorage.removeItem(key);
      else win.localStorage.setItem(key, value);
    }
    frame.remove();
  }
})();
</script></html>
